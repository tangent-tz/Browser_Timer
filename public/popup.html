<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Auto Tab Timer</title>
    <link rel="stylesheet" href="popup.css">
</head>
<body>
<div class="container">
    <h1 data-i18n="extensionTitle">Auto Tab Timer</h1>
    <div class="tabs">
        <button id="tabTimer" class="tab active">
            <img src="icons/timer.svg" alt="Timer Icon" class="tab-icon" data-i18n-alt="timerAltIcon" />
            <span data-i18n="tabTimer">Timer</span>
        </button>
        <button id="tabSettings" class="tab">
            <img src="icons/settings.svg" alt="Settings Icon" class="tab-icon" data-i18n-alt="settingsAltIcon" />
            <span data-i18n="tabSettings">Settings</span>
        </button>
    </div>
    <!-- Timer Section (Default) -->
    <div id="timerSection" class="tab-content active">
        <div class="input-group">
            <div class="input-field">
                <label for="hoursInput" data-i18n="hoursLabel">Hours</label>
                <input type="number" id="hoursInput" value="0" min="0">
            </div>
            <div class="input-field">
                <label for="minutesInput" data-i18n="minutesLabel">Minutes</label>
                <input type="number" id="minutesInput" value="0" min="0">
            </div>
            <div class="input-field">
                <label for="secondsInput" data-i18n="secondsLabel">Seconds</label>
                <input type="number" id="secondsInput" value="0" min="0">
            </div>
        </div>
        <button id="startTimerBtn" data-i18n="startTimerButton">Start Timer</button>
        <div id="timersList"></div>
    </div>
    <!-- Settings Section -->
    <div id="settingsSection" class="tab-content">
        <div class="settings-item">
            <label>
                <input type="checkbox" id="notificationsToggle" checked>
                <span data-i18n="enableNotifications">Enable Notifications</span>
            </label>
        </div>
    </div>
</div>
<script src="popup.js"></script>
</body>
</html>
